# The site is built by the GitHub Actions workflow in .github/workflows, not by
# the classic GitHub Pages build, so none of these settings are overridden by
# GitHub.

safe: false

permalink: /:categories/:year/:month/:title

timezone: Australia/Melbourne

plugins:
  - jekyll-gist

sass:
  sourcemap: never

exclude:
  - mise.toml
  - README.md
  - start.sh
  - tools/
  - vendor/
